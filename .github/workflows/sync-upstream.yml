name: Sync fork with upstream

# Keeps this fork up to date with iOfficeAI/AionCore automatically.
on:
  schedule:
    # Runs every day at 03:00 Beijing time (UTC+8).
    # GitHub Actions cron uses UTC only, so 03:00 UTC+8 == 19:00 UTC (previous day).
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/iOfficeAI/AionCore.git
          git fetch upstream --tags

      - name: Merge upstream into fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-edit

      - name: Push to fork
        run: git push origin main
